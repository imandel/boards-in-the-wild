[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ecad-paper-figures"
version = "0.2.1"
description = "Receipt-bound publication figures for ecad-corpus releases"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10,<4",
  "pyarrow>=25,<26",
]

[project.scripts]
ecad-paper-figures = "ecad_paper_figures.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecad_paper_figures"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
